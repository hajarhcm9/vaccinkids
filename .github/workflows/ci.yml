name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaccinikids_user
          POSTGRES_PASSWORD: vaccinikids_password
          POSTGRES_DB: vaccinikids
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaccinikids_user -d vaccinikids"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: vaccinikids
      TEST_DB_NAME: vaccinikids_test
      DB_USER: vaccinikids_user
      DB_PASSWORD: vaccinikids_password
      JWT_SECRET: ci-only-jwt-secret
      JWT_REFRESH_SECRET: ci-only-refresh-secret
      OTP_HASH_SECRET: ci-only-otp-hash-secret
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:scripts
      - run: npm run check:environment
      - run: npm run check:release-identity
      - run: npm run check:parent-mobile-security
      - run: npm audit --audit-level=high
      - run: npm test -- --runInBand
      - run: npm run test:rate-limit-redis
      - run: npm run db:verify-invariants
      - run: npm run test:performance
      - run: npm run mobile:bundle:android

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - name: Build parent React Native Android app
        run: ./android/gradlew -p android app:assembleDebug -PreactNativeArchitectures=arm64-v8a
      - name: Build personnel Android app
        run: ./gradlew :app:assembleDebug

  ios-debug:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - run: cd ios && pod install
      - name: Build parent iOS app without signing
        run: >
          xcodebuild -workspace ios/VacciniKids.xcworkspace
          -scheme VacciniKids -configuration Debug
          -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
