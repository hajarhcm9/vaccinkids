name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaccinikids_user
          POSTGRES_PASSWORD: vaccinikids_password
          POSTGRES_DB: vaccinikids
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaccinikids_user -d vaccinikids"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: vaccinikids
      TEST_DB_NAME: vaccinikids_test
      DB_USER: vaccinikids_user
      DB_PASSWORD: vaccinikids_password
      JWT_SECRET: ci-only-jwt-secret
      JWT_REFRESH_SECRET: ci-only-refresh-secret
      OTP_HASH_SECRET: ci-only-otp-hash-secret
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:scripts
      - run: npm run check:environment
      - run: npm run check:release-identity
      - run: npm run check:parent-mobile-security
      - run: npm audit --audit-level=high
      - run: npm test -- --runInBand
      - run: npm run db:test-upgrade
      - run: npm run test:rate-limit-redis
      - run: npm run db:verify-invariants
      - run: npm run test:performance
      - run: npm run mobile:bundle:android
      - name: Exercise encrypted backup and isolated restore
        run: |
          sudo apt-get update
          sudo apt-get install -y age postgresql-client
          age-keygen -o /tmp/vaccinikids-age-key
          echo "BACKUP_AGE_RECIPIENT=$(age-keygen -y /tmp/vaccinikids-age-key)" >> "$GITHUB_ENV"
          PGPASSWORD="$DB_PASSWORD" createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" vaccinikids_restore_test
      - run: npm run migrate
      - run: DATABASE_URL=postgres://vaccinikids_user:vaccinikids_password@localhost:5432/vaccinikids BACKUP_DIR=/tmp/backups npm run db:backup
      - run: RESTORE_DATABASE_URL=postgres://vaccinikids_user:vaccinikids_password@localhost:5432/vaccinikids_restore_test BACKUP_AGE_IDENTITY_FILE=/tmp/vaccinikids-age-key npm run db:restore -- "$(ls /tmp/backups/*.dump.age)"
      - run: DATABASE_URL=postgres://vaccinikids_user:vaccinikids_password@localhost:5432/vaccinikids_restore_test npm run db:verify-invariants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - name: Lint and unit test parent Android
        run: ./android/gradlew -p android lintDebug testDebugUnitTest
      - name: Lint and unit test personnel Android
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest
      - name: Build parent React Native Android app
        run: ./android/gradlew -p android app:assembleDebug -PreactNativeArchitectures=arm64-v8a
      - name: Build personnel Android app
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14

  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - name: Generate isolated CI signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/vaccinikids-ci.jks" -storepass ci-release-only -alias ci-release -keypass ci-release-only -dname "CN=VacciniKids CI" -keyalg RSA -keysize 2048 -validity 2
          echo "ANDROID_RELEASE_STORE_FILE=$RUNNER_TEMP/vaccinikids-ci.jks" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_STORE_PASSWORD=ci-release-only" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_ALIAS=ci-release" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_PASSWORD=ci-release-only" >> "$GITHUB_ENV"
          echo "STAFF_ANDROID_RELEASE_STORE_FILE=$RUNNER_TEMP/vaccinikids-ci.jks" >> "$GITHUB_ENV"
          echo "STAFF_ANDROID_RELEASE_STORE_PASSWORD=ci-release-only" >> "$GITHUB_ENV"
          echo "STAFF_ANDROID_RELEASE_KEY_ALIAS=ci-release" >> "$GITHUB_ENV"
          echo "STAFF_ANDROID_RELEASE_KEY_PASSWORD=ci-release-only" >> "$GITHUB_ENV"
      - name: Build signed CI release artifacts
        env:
          MOBILE_ENV: staging
          API_BASE_URL: https://staging.vaccinikids.invalid/api
          STAFF_API_BASE_URL: https://staging.vaccinikids.invalid/api
        run: |
          npm run mobile:configure
          ./android/gradlew -p android app:assembleRelease -PreactNativeArchitectures=arm64-v8a
          ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-ci-signed-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/
            app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 7

  android-instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Run personnel instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumentation-${{ github.sha }}
          path: app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14

  ios-debug:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - run: cd ios && pod install
      - name: Build parent iOS app without signing
        run: >
          xcodebuild -workspace ios/VacciniKids.xcworkspace
          -scheme VacciniKids -configuration Debug
          -sdk iphonesimulator -derivedDataPath build/ios-ci CODE_SIGNING_ALLOWED=NO build
      - name: Build parent iOS release configuration without distribution signing
        run: >
          xcodebuild -workspace ios/VacciniKids.xcworkspace
          -scheme VacciniKids -configuration Release
          -sdk iphonesimulator -derivedDataPath build/ios-ci CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-release-${{ github.sha }}
          path: build/ios-ci/Build/Products/Release-iphonesimulator/VacciniKids.app
          if-no-files-found: error
          retention-days: 7
